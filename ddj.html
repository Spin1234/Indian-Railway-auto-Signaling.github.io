<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dum Dum Jn. - Electronic Interlocking Web Panel</title>
    <style>
        :root {
            --bg-main: #090d16;
            --bg-panel: #020617;
            --bg-control: #131824;
            --btn-bg: #1e293b;
            --btn-hover: #334155;
            --text-cyan: #38bdf8;
            --text-green: #22c55e;
            --text-rose: #f43f5e;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-main);
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        h2 {
            color: var(--text-cyan);
            margin-bottom: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            text-align: center;
            letter-spacing: 1px;
        }

        #panel-container {
            width: 1110px;
            background-color: var(--bg-panel);
            border: 2px solid #1e293b;
            border-radius: 6px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7);
            position: relative;
        }

        canvas {
            display: block;
            background-color: var(--bg-panel);
        }

        #control-bar {
            width: 1110px;
            background-color: var(--bg-control);
            border: 1px solid #1e293b;
            border-radius: 4px;
            margin-top: 15px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .panel-label {
            color: #94a3b8;
            font-size: 0.85rem;
            font-weight: bold;
            margin-right: 5px;
        }

        button {
            background-color: var(--btn-bg);
            color: #ffffff;
            border: 1px solid #475569;
            padding: 8px 14px;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s, border-color 0.2s;
        }

        button:hover {
            background-color: var(--btn-hover);
            border-color: var(--text-cyan);
        }

        #logger-container {
            width: 1110px;
            margin-top: 15px;
        }

        #log-box {
            width: 100%;
            height: 140px;
            background-color: var(--bg-panel);
            border: 1px solid #1e293b;
            border-radius: 4px;
            padding: 10px;
            font-size: 0.85rem;
            color: var(--text-green);
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h2>DUM DUM JUNCTION AUTOMATIC SYSTEMS PANEL - FAIL SAFE WEB RRI</h2>

    <div id="panel-container">
        <canvas id="paintArea" width="1110" height="380"></canvas>
    </div>

    <div id="control-bar">
        <span class="panel-label">CTC OPERATION PANEL:</span>
        <button onclick="injectTrain('UP', 'P1')">Inject P1 (Up Main)</button>
        <button onclick="injectTrain('UP', 'P3')">Inject P3 (Up Chord)</button>
        <button onclick="injectTrain('DOWN', 'P2')">Inject P2 (Dn Main)</button>
        <button onclick="injectTrain('DOWN', 'P4')">Inject P4 (Dn Bangaon)</button>
        <button onclick="injectTrain('DOWN', 'P5')">Inject P5 (Dn Circular)</button>
    </div>

    <div id="logger-container">
        <div id="log-box"></div>
    </div>

    <script>
        const canvas = document.getElementById('paintArea');
        const ctx = canvas.getContext('2d');
        const logBox = document.getElementById('log-box');

        // =================================================================
        // FIXED ELECTRONIC INTERLOCKING GEOMETRY (ALL 5 PANEL PLATFORMS)
        // =================================================================
        const TRACK_GEOMETRY = {
            'SEAL_UP_APP':      [[30, 100], [200, 100]],    
            'P1_TRK':           [[200, 100], [650, 100]],   
            'MAIN_LINE_OUT':    [[650, 100], [1050, 100]],  

            'SEAL_CHORD_APP':   [[30, 200], [200, 200]],    
            'P3_TRK':           [[200, 200], [650, 200]],   
            'CHORD_LINE_OUT':   [[650, 200], [760, 200], [820, 160], [1050, 160]],

            'DN_MAIN_APP':      [[1050, 150], [700, 150]],  
            'P2_TRK':           [[700, 150], [250, 150]],   
            'SEAL_MAIN_DN_OUT': [[250, 150], [30, 150]],    

            'DN_BANG_APP':      [[1050, 250], [700, 250]],  
            'P4_TRK':           [[700, 250], [250, 250]],   
            'SEAL_BANG_DN_OUT': [[250, 250], [30, 250]],    

            'DN_CIRC_APP':      [[1050, 300], [700, 300]],  
            'P5_TRK':           [[700, 300], [250, 300]],   
            'CIRCULAR_DN_OUT':  [[250, 300], [30, 300]]     
        };

        const SIGNALS_CONFIG = [
            {id: 'S1_HOME',   track: 'SEAL_UP_APP',      x: 200, y: 100, lbl: 'S1-HOME',    side: -1},
            {id: 'S3_HOME',   track: 'SEAL_CHORD_APP',   x: 200, y: 200, lbl: 'S3-HOME',    side: -1},
            {id: 'P1_STRTR',  track: 'P1_TRK',           x: 650, y: 100, lbl: 'P1-STRTR',   side: -1},
            {id: 'P3_STRTR',  track: 'P3_TRK',           x: 650, y: 200, lbl: 'P3-STRTR',   side: -1},
            
            {id: 'DN_HOME_M', track: 'DN_MAIN_APP',      x: 700, y: 150, lbl: 'DN-HOME-M',  side: 1},
            {id: 'DN_HOME_B', track: 'DN_BANG_APP',      x: 700, y: 250, lbl: 'DN-HOME-B',  side: 1},
            {id: 'DN_HOME_C', track: 'DN_CIRC_APP',      x: 700, y: 300, lbl: 'DN-HOME-C',  side: 1},
            {id: 'P2_STRTR',  track: 'P2_TRK',           x: 250, y: 150, lbl: 'P2-STRTR',   side: 1},
            {id: 'P4_STRTR',  track: 'P4_TRK',           x: 250, y: 250, lbl: 'P4-STRTR',   side: 1},
            {id: 'P5_STRTR',  track: 'P5_TRK',           x: 250, y: 300, lbl: 'P5-STRTR',   side: 1}
        ];

        // Panel System Variables
        let trackOccupancy = {};
        let signalAspects = {};
        let activeTrains = [];
        let clockTicks = 0;

        // Initialize tracking maps
        for (let key in TRACK_GEOMETRY) trackOccupancy[key] = null;
        SIGNALS_CONFIG.forEach(s => signalAspects[s.id] = 'RED');

        function logMessage(msg) {
            logBox.innerHTML += `>> ${msg}\n`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        logMessage("INTERLOCKING REGISTER ENGAGED: Web-based relay system synchronized.");

        function injectTrain(direction, platform) {
            let path = [];
            if (direction === 'UP') {
                path = (platform === 'P1') ? ['SEAL_UP_APP', 'P1_TRK', 'MAIN_LINE_OUT'] : ['SEAL_CHORD_APP', 'P3_TRK', 'CHORD_LINE_OUT'];
            } else {
                if (platform === 'P2') path = ['DN_MAIN_APP', 'P2_TRK', 'SEAL_MAIN_DN_OUT'];
                else if (platform === 'P4') path = ['DN_BANG_APP', 'P4_TRK', 'SEAL_BANG_DN_OUT'];
                else path = ['DN_CIRC_APP', 'P5_TRK', 'CIRCULAR_DN_OUT'];
            }

            if (trackOccupancy[path[0]] !== null) {
                logMessage(`❌ INJECTION BLOCKED: Approach section ${path[0]} occupied.`);
                return;
            }

            let t_id = `${platform.startsWith('P1') || platform.startsWith('P2') ? 'EXP' : 'EMU'}-${Math.floor(100 + Math.random() * 899)}`;
            let newTrain = {
                id: t_id, direction: direction, route_path: path,
                current_idx: 0, progress: 0.0, current_speed: 0.02, max_speed: 0.02,
                state: 'RUNNING', dwell_counter: 0, has_berthed_here: false
            };

            activeTrains.push(newTrain);
            trackOccupancy[path[0]] = t_id;
            logMessage(`🟢 Despatched train ${t_id} into layout boundary.`);
        }

        function evaluateInterlocking() {
            // UP Logic
            signalAspects['S1_HOME'] = trackOccupancy['P1_TRK'] ? 'RED' : 'GREEN';
            signalAspects['P1_STRTR'] = trackOccupancy['MAIN_LINE_OUT'] ? 'RED' : 'GREEN';
            signalAspects['S3_HOME'] = trackOccupancy['P3_TRK'] ? 'RED' : 'YELLOW';
            signalAspects['P3_STRTR'] = trackOccupancy['CHORD_LINE_OUT'] ? 'RED' : 'GREEN';
            
            // DOWN Logic
            signalAspects['DN_HOME_M'] = trackOccupancy['P2_TRK'] ? 'RED' : 'GREEN';
            signalAspects['P2_STRTR'] = trackOccupancy['SEAL_MAIN_DN_OUT'] ? 'RED' : 'GREEN';
            signalAspects['DN_HOME_B'] = trackOccupancy['P4_TRK'] ? 'RED' : 'YELLOW';
            signalAspects['P4_STRTR'] = trackOccupancy['SEAL_BANG_DN_OUT'] ? 'RED' : 'GREEN';
            signalAspects['DN_HOME_C'] = trackOccupancy['P5_TRK'] ? 'RED' : 'GREEN';
            signalAspects['P5_STRTR'] = trackOccupancy['CIRCULAR_DN_OUT'] ? 'RED' : 'GREEN';
        }

        function updateTrainPositions() {
            for (let i = activeTrains.length - 1; i >= 0; i--) {
                let t = activeTrains[i];
                let curr_blk = t.route_path[t.current_idx];

                if (t.state === 'BERTHED') {
                    t.dwell_counter++;
                    t.current_speed = 0.0;
                    if (t.dwell_counter >= 80) {
                        t.state = 'RUNNING';
                        logMessage(`🔔 Train ${t.id} finished boarding. Seeking departure route aspect.`);
                    }
                    continue;
                }

                // Associate matching block protecting signal
                let sig_aspect = 'GREEN';
                if (curr_blk === 'SEAL_UP_APP')      sig_aspect = signalAspects['S1_HOME'];
                else if (curr_blk === 'SEAL_CHORD_APP') sig_aspect = signalAspects['S3_HOME'];
                else if (curr_blk === 'P1_TRK')         sig_aspect = signalAspects['P1_STRTR'];
                else if (curr_blk === 'P3_TRK')         sig_aspect = signalAspects['P3_STRTR'];
                else if (curr_blk === 'DN_MAIN_APP')    sig_aspect = signalAspects['DN_HOME_M'];
                else if (curr_blk === 'DN_BANG_APP')    sig_aspect = signalAspects['DN_HOME_B'];
                else if (curr_blk === 'DN_CIRC_APP')    sig_aspect = signalAspects['DN_HOME_C'];
                else if (curr_blk === 'P2_TRK')         sig_aspect = signalAspects['P2_STRTR'];
                else if (curr_blk === 'P4_TRK')         sig_aspect = signalAspects['P4_STRTR'];
                else if (curr_blk === 'P5_TRK')         sig_aspect = signalAspects['P5_STRTR'];

                // Fail-safe Braking Loop Stop boundary at 0.82 to avoid overlap visual bugs
                if (sig_aspect === 'RED') {
                    if (t.progress >= 0.50) {
                        let dist = 0.82 - t.progress;
                        if (dist > 0) {
                            t.current_speed = t.max_speed * (dist / 0.32);
                        } else {
                            t.current_speed = 0.0;
                            t.progress = 0.82;
                        }
                        if (t.progress >= 0.82) {
                            t.progress = 0.82;
                            t.current_speed = 0.0;
                            continue; 
                        }
                    }
                } else {
                    if (t.current_speed < t.max_speed) {
                        t.current_speed += 0.003;
                        if (t.current_speed > t.max_speed) t.current_speed = t.max_speed;
                    }
                }

                t.progress += t.current_speed;

                // Handle Platform Station Stops
                if (t.state === 'RUNNING' && curr_blk.includes('P') && curr_blk.includes('_TRK')) {
                    if (!t.has_berthed_here && t.progress >= 0.65) {
                        t.state = 'BERTHED';
                        t.dwell_counter = 0;
                        t.has_berthed_here = true;
                        t.current_speed = 0.0;
                        logMessage(`🚉 Train ${t.id} berthed cleanly at platform section limits.`);
                        continue;
                    }
                }

                // Block-to-Block Handover routine
                if (t.progress >= 1.0) {
                    if (t.current_idx + 1 < t.route_path.length) {
                        let next_blk = t.route_path[t.current_idx + 1];

                        if (trackOccupancy[next_blk] === null) {
                            trackOccupancy[curr_blk] = null;
                            t.current_idx++;
                            t.progress = 0.0;
                            trackOccupancy[next_blk] = t.id;
                            t.current_speed = t.max_speed;
                            t.has_berthed_here = false;
                        } else {
                            t.progress = 0.82;
                            t.current_speed = 0.0;
                        }
                    } else {
                        trackOccupancy[curr_blk] = null;
                        logMessage(`🏁 Train ${t.id} cleared track layout limits.`);
                        activeTrains.splice(i, 1);
                    }
                }
            }
        }

        function getVectorCoordinates(points, progress) {
            let totalSegments = points.length - 1;
            let currentSeg = Math.min(letSegment = Math.floor(progress * totalSegments), totalSegments - 1);
            let segmentProgress = (progress * totalSegments) - currentSeg;

            let pA = points[currentSeg];
            let pB = points[currentSeg + 1];

            return {
                x: pA[0] + (pB[0] - pA[0]) * segmentProgress,
                y: pA[1] + (pB[1] - pA[1]) * segmentProgress
            };
        }

        function renderCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Base Layout Tracks
            for (let block_id in TRACK_GEOMETRY) {
                let pts = TRACK_GEOMETRY[block_id];
                ctx.lineWidth = 4;
                ctx.strokeStyle = trackOccupancy[block_id] ? "#dc2626" : "#334155";
                ctx.beginPath();
                ctx.moveTo(pts[0][0], pts[0][1]);
                for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
                ctx.stroke();
            }

            // Aesthetic Interlocking crossovers configurations 
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#1e293b";
            ctx.beginPath(); ctx.moveTo(140, 200); ctx.lineTo(200, 100); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(140, 300); ctx.lineTo(200, 250); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(650, 200); ctx.lineTo(710, 150); ctx.stroke();

            // Text Labels For Layout Channels
            ctx.font = "bold 11px Courier New";
            ctx.textAlign = "center";
            ctx.fillStyle = "#38bdf8"; ctx.fillText("PLATFORM 1 [UP MAIN LINE]", 440, 82);
            ctx.fillStyle = "#f43f5e"; ctx.fillText("PLATFORM 2 [DN MAIN LINE]", 440, 134);
            ctx.fillStyle = "#38bdf8"; ctx.fillText("PLATFORM 3 [UP CHORD / BANGAON]", 440, 182);
            ctx.fillStyle = "#f43f5e"; ctx.fillText("PLATFORM 4 [DN BANGAON / HASNABAD]", 440, 234);
            ctx.fillStyle = "#f43f5e"; ctx.fillText("PLATFORM 5 [CIRCULAR RAIL]", 440, 282);

            // Draw Signal Configurations 
            SIGNALS_CONFIG.forEach(sig => {
                let aspect = signalAspects[sig.id];
                let color = (aspect === 'RED') ? '#dc2626' : (aspect === 'YELLOW' ? '#eab308' : '#22c55e');
                let offset_y = 14 * sig.side;

                // Signal Housing Base
                ctx.fillStyle = "#000000";
                ctx.strokeStyle = "#475569";
                ctx.lineWidth = 1;
                ctx.fillRect(sig.x - 5, sig.y + offset_y - 5, 10, 10);
                ctx.strokeRect(sig.x - 5, sig.y + offset_y - 5, 10, 10);

                // Lamp Aspect Circle
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(sig.x, sig.y + offset_y, 3, 0, 2 * Math.PI);
                ctx.fill();

                // Text Description
                ctx.font = "bold 10px Courier New";
                ctx.fillStyle = "#64748b";
                ctx.fillText(sig.lbl, sig.x, sig.y + (offset_y * 2.3));
            });

            // Draw Moving Rolling Stock Consists
            activeTrains.forEach(t => {
                let pts = TRACK_GEOMETRY[t.route_path[t.current_idx]];
                let pos = getVectorCoordinates(pts, t.progress);

                ctx.fillStyle = (t.direction === 'UP') ? "#0284c7" : "#db2777";
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 1;
                ctx.fillRect(pos.x - 20, pos.y - 7, 40, 14);
                ctx.strokeRect(pos.x - 20, pos.y - 7, 40, 14);

                ctx.font = "bold 9px Courier New";
                ctx.fillStyle = "#ffffff";
                ctx.fillText(t.id, pos.x, pos.y + 3);
            });
        }

        function systemLoop() {
            clockTicks++;
            // Automatic random scheduling injector loop
            if (clockTicks % 120 === 0) {
                let d = Math.random() > 0.5 ? 'UP' : 'DOWN';
                let p = (d === 'UP') ? (Math.random() > 0.5 ? 'P1' : 'P3') : (Math.random() > 0.6 ? 'P2' : (Math.random() > 0.5 ? 'P4' : 'P5'));
                injectTrain(d, p);
            }

            evaluateInterlocking();
            updateTrainPositions();
            renderCanvas();
            requestAnimationFrame(systemLoop);
        }

        // Start Web Simulation Runtime
        requestAnimationFrame(systemLoop);
    </script>
</body>
</html>
